name: Rust-Clippy-Analyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '17 20 * * 0'

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install required cargo
        run: cargo install clippy-sarif sarif-fmt

      # Produces the SARIF report for GitHub code scanning. The pipe hides
      # clippy's exit code, so this step never fails on its own; the
      # "Enforce" steps below are what actually fail the job.
      - name: Run rust-clippy (SARIF report)
        run:
          cargo clippy
          --all-targets
          --all-features
          --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

      - name: Enforce formatting
        run: cargo fmt --all --check

      - name: Enforce clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings